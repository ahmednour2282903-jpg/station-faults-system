<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منظومة متابعة أعطال المحطات</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .card .num {
      font-size: 24px;
      font-weight: bold;
      margin-top: 6px;
    }
    .box {
      background: #1e293b;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 9px;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-family: inherit;
      box-sizing: border-box;
    }
    button {
      background: #0284c7;
      border: none;
      font-weight: bold;
      cursor: pointer;
      width: auto;
      padding: 9px 18px;
    }
    button:hover {
      background: #0369a1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border-bottom: 1px solid #334155;
      padding: 9px;
      text-align: right;
    }
    th {
      background: #334155;
    }
    @media (max-width: 768px) {
      .kpis, .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>منظومة متابعة أعطال المحطات</h2>

    <div class="kpis">
      <div class="card"><div>الإجمالي</div><div class="num" id="totalCount">0</div></div>
      <div class="card"><div>مفتوح</div><div class="num" id="openCount">0</div></div>
      <div class="card"><div>جاري العمل</div><div class="num" id="progressCount">0</div></div>
      <div class="card"><div>مغلق</div><div class="num" id="closedCount">0</div></div>
    </div>

    <div class="box">
      <h3>تسجيل عطل جديد</h3>
      <form id="faultForm">
        <div class="row">
          <input type="text" id="station" placeholder="اسم المحطة *" required />
          <input type="text" id="equipment" placeholder="المعدة / اللوحة *" required />
          <input type="text" id="technician" placeholder="الفني المسؤول" />
        </div>
        <div class="row">
          <select id="faultType">
            <option value="كهربائي">كهربائي</option>
            <option value="PLC وتحكم">PLC وتحكم</option>
            <option value="VFD">VFD</option>
            <option value="حساسات وقياس">حساسات وقياس</option>
            <option value="ميكانيكي">ميكانيكي</option>
          </select>
          <select id="priority">
            <option value="عالية">عالية</option>
            <option value="متوسطة" selected>متوسطة</option>
            <option value="منخفضة">منخفضة</option>
          </select>
          <select id="status">
            <option value="مفتوح">مفتوح</option>
            <option value="جاري العمل">جاري العمل</option>
            <option value="مغلق">مغلق</option>
          </select>
        </div>
        <div style="margin-bottom: 10px;">
          <textarea id="notes" rows="2" placeholder="وصف العطل أو الإجراء المتخذ"></textarea>
        </div>
        <button type="submit">حفظ العطل</button>
      </form>
    </div>

    <div class="box">
      <h3>سجل الأعطال</h3>
      <input type="text" id="search" placeholder="ابحث بالمحطة أو المعدة أو الفني..." style="margin-bottom:10px;" />
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>المحطة</th>
            <th>المعدة</th>
            <th>النوع</th>
            <th>الأولوية</th>
            <th>الحالة</th>
            <th>الفني</th>
            <th>ملاحظات</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <script>
    const STORAGE_KEY = "station_faults_v2";
    let faults = [];

    const form = document.getElementById("faultForm");
    const tbody = document.getElementById("tbody");
    const searchInput = document.getElementById("search");

    function loadFaults() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        faults = data ? JSON.parse(data) : [];
        if (!Array.isArray(faults)) faults = [];
      } catch (err) {
        faults = [];
      }
    }

    function saveFaults() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(faults));
    }

    function updateCounters() {
      document.getElementById("totalCount").textContent = faults.length;
      document.getElementById("openCount").textContent = faults.filter(f => f.status === "مفتوح").length;
      document.getElementById("progressCount").textContent = faults.filter(f => f.status === "جاري العمل").length;
      document.getElementById("closedCount").textContent = faults.filter(f => f.status === "مغلق").length;
    }

    function escapeText(val) {
      return String(val || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderTable() {
      updateCounters();
      const term = searchInput.value.trim().toLowerCase();

      const list = faults.filter(f => {
        if (!term) return true;
        return [f.station, f.equipment, f.technician, f.faultType, f.notes]
          .join(" ")
          .toLowerCase()
          .includes(term);
      });

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#94a3b8;">لا توجد أعطال مسجلة</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((f, index) => `
        <tr>
          <td>${index + 1}</td>
          <td><strong>${escapeText(f.station)}</strong></td>
          <td>${escapeText(f.equipment)}</td>
          <td>${escapeText(f.faultType)}</td>
          <td>${escapeText(f.priority)}</td>
          <td>${escapeText(f.status)}</td>
          <td>${escapeText(f.technician || "-")}</td>
          <td>${escapeText(f.notes || "-")}</td>
          <td>
            ${f.status !== "مغلق" ? `<button type="button" onclick="closeFault('${f.id}')">إغلاق</button>` : ""}
            <button type="button" onclick="deleteFault('${f.id}')" style="background:#dc2626;">حذف</button>
          </td>
        </tr>
      `).join("");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const station = document.getElementById("station").value.trim();
      const equipment = document.getElementById("equipment").value.trim();
      if (!station || !equipment) return;

      const item = {
        id: String(Date.now()),
        station,
        equipment,
        technician: document.getElementById("technician").value.trim(),
        faultType: document.getElementById("faultType").value,
        priority: document.getElementById("priority").value,
        status: document.getElementById("status").value,
        notes: document.getElementById("notes").value.trim()
      };

      faults.unshift(item);
      saveFaults();
      renderTable();
      form.reset();
      document.getElementById("priority").value = "متوسطة";
      document.getElementById("status").value = "مفتوح";
    });

    window.closeFault = function (id) {
      const target = faults.find(f => f.id === id);
      if (target) {
        target.status = "مغلق";
        saveFaults();
        renderTable();
      }
    };

    window.deleteFault = function (id) {
      faults = faults.filter(f => f.id !== id);
      saveFaults();
      renderTable();
    };

    searchInput.addEventListener("input", renderTable);

    loadFaults();
    renderTable();
  </script>
</body>
</html>
